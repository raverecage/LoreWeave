<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoreWeave</title>
<style>
/* ===== 1. Design tokens ===== */
:root{
 --bg:#101216;--p:#171a20;--p2:#1f232b;--b:#2e333d;--b2:#434a57;--t:#ece9e2;--m:#a4a8b1;--a:#d9b36c;--a-ink:#1b1407;--grid:#ffffff09;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
 --r1:6px;--r2:10px;--r3:16px;
 --shadow:0 10px 30px #0007;--fast:.15s ease;--slow:.3s ease;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --c-family:#e2b552;--c-ally:#3fbfc4;--c-enemy:#ec5f63;--c-rival:#f2913d;--c-romantic:#ef8cbc;--c-mentor:#a891f2;--c-member:#8595af;--c-caused:#74bd6c;--c-owns:#cc74e0;--c-located:#b3a07c;--c-knows:#9b9fa7;--c-killed:#c4455c;--c-appears:#5fae8c;
 color-scheme:dark}
:root.l{--bg:#eceae4;--p:#fbfaf7;--p2:#efede7;--b:#d6d2c8;--b2:#aaa598;--t:#1d1f24;--m:#585d68;--a:#7a5613;--a-ink:#fff;--grid:#0000000b;--shadow:0 10px 30px #0002;
 --c-family:#9a7008;--c-ally:#0b7c82;--c-enemy:#c02f37;--c-rival:#b85a07;--c-romantic:#b8367a;--c-mentor:#6a4cc4;--c-member:#566783;--c-caused:#3b7f34;--c-owns:#8f35a6;--c-located:#7b6840;--c-knows:#666b74;--c-killed:#8d1f37;--c-appears:#2b7354;color-scheme:light}

/* ===== 2. Base components ===== */
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--t);font:14px/1.5 var(--ui)}
h2,h3,.display{font-family:var(--display);font-weight:600;line-height:1.2;margin:0}
h3{font-size:19px;margin-bottom:var(--s3)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--b);border-radius:var(--r2);padding:6px 12px;min-height:34px}
button{cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:border-color var(--fast),background var(--fast)}
button:hover{border-color:var(--b2)}
button.pri,button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:var(--a-ink);font-weight:600}
input[type=checkbox],input[type=range],input[type=color]{min-height:0;accent-color:var(--a)}
a{color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.sp{flex:1}.sm{color:var(--m);font-size:12px}[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ico{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;gap:5px;align-items:center;min-height:28px;padding:2px 10px;border-radius:99px;border:1px solid var(--b);background:var(--p2);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;gap:var(--s2);align-items:center;width:100%;padding:6px var(--s2);border-radius:var(--r2);cursor:pointer;text-align:left}
.row:hover,.row.on{background:var(--p2)}
button.row{background:none;border-color:transparent;justify-content:flex-start}button.row:hover{background:var(--p2)}
.trunc{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
label{display:block;font-size:12px;color:var(--m);margin:var(--s3) 0 var(--s1)}
textarea{min-height:70px;resize:vertical;width:100%}

/* ===== 3. Layout ===== */
header{display:flex;gap:var(--s2);align-items:center;padding:10px var(--s4);background:var(--p);border-bottom:1px solid var(--b);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:var(--s2);font:600 20px var(--display);margin-right:var(--s2);white-space:nowrap}.brand .ico{color:var(--a);width:22px;height:22px}
#uSel{max-width:210px}
#bSearch{flex:1;max-width:420px;justify-content:flex-start;color:var(--m);overflow:hidden;white-space:nowrap}
kbd{font:11px var(--ui);border:1px solid var(--b2);border-radius:4px;padding:0 5px;margin-left:auto}
.seg{display:flex;gap:2px;background:var(--p2);border-radius:var(--r2);padding:2px}.seg button{border-color:transparent;background:none;min-height:30px}.seg button[aria-pressed=true]{background:var(--a)}
#more{position:absolute;right:var(--s4);top:52px;background:var(--p);border:1px solid var(--b2);border-radius:var(--r3);padding:var(--s2);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:210px;z-index:60}
#more button{justify-content:flex-start;background:none;border-color:transparent}#more button:hover{background:var(--p2)}
main{flex:1;display:grid;grid-template-columns:272px minmax(0,1fr) 0;min-height:0;transition:grid-template-columns var(--slow)}
main.open{grid-template-columns:272px minmax(0,1fr) 360px}
main>aside{background:var(--p);overflow:auto;min-height:0}
#cen{display:flex;flex-direction:column;min-width:0;min-height:0}#mainv{flex:1;display:flex;flex-direction:column;min-height:0}
.mob{display:none!important}

/* ===== 4. Sidebar and filters ===== */
#side{border-right:1px solid var(--b);padding:var(--s3)}
#sq{width:100%;min-height:42px;border-color:var(--b2)}
details{border-bottom:1px solid var(--b);padding:2px 0}
summary{cursor:pointer;padding:10px var(--s1);font:600 15px var(--display);display:flex;align-items:center;gap:var(--s2);list-style:none}
summary::after{content:"";margin-left:auto;width:7px;height:7px;border:solid var(--m);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform var(--fast)}
details[open]>summary::after{transform:rotate(45deg)}
details>div{padding:0 0 var(--s3)}
#side select,#side details input{width:100%}
.count{margin-left:auto;color:var(--m);font-size:12px}

/* ===== 5. Canvas ===== */
#st{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;outline-offset:-3px;
 background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
#st:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.anim{transition:transform .35s ease}
#eg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#rect{position:absolute;border:1px dashed var(--a);background:#d9b36c22;display:none}
.float{position:absolute;background:color-mix(in srgb,var(--p) 94%,transparent);border:1px solid var(--b);border-radius:var(--r2);box-shadow:var(--shadow);cursor:default;z-index:5}
#tools{left:var(--s3);top:var(--s3);display:flex;gap:var(--s1);padding:var(--s1);flex-wrap:wrap;max-width:calc(100% - 210px)}
#zoomc{right:var(--s3);bottom:var(--s3);display:flex;flex-direction:column;gap:var(--s1);padding:var(--s1)}
#zoomc button,#tools button{min-width:34px}
#mm{right:var(--s3);top:var(--s3);width:170px;height:106px;cursor:pointer}
#legend{left:var(--s3);bottom:var(--s3);max-width:min(290px,calc(100% - 80px));max-height:45%;overflow:auto;padding:0 var(--s3);font-size:12px}
#legend summary{font-size:14px;padding:7px 0}#legend details{border:0}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:3px var(--s3);margin-bottom:var(--s2)}.lg span{display:flex;gap:6px;align-items:center;white-space:nowrap}
#status{left:var(--s3);top:64px;padding:6px var(--s3);font-size:12px;display:flex;gap:var(--s2);align-items:center;white-space:nowrap}
#status button{min-height:26px;padding:1px 9px}
#selbar{left:50%;bottom:76px;transform:translateX(-50%);display:flex;gap:var(--s2);padding:var(--s2);align-items:center;max-width:calc(100% - 24px);z-index:6}
#selbar b{max-width:170px;padding:0 var(--s1)}
#hint{right:60px;bottom:var(--s3);padding:6px var(--s3);font-size:12px;color:var(--m);max-width:260px}
.empty{margin:auto;text-align:center;max-width:380px;padding:var(--s5);color:var(--m)}.empty h2{color:var(--t);font-size:20px;margin-bottom:var(--s2)}
#st>.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;pointer-events:auto}
#tt{position:fixed;z-index:80;pointer-events:none;background:var(--p);border:1px solid var(--b2);border-radius:var(--r2);box-shadow:var(--shadow);padding:var(--s2) var(--s3);max-width:280px;font-size:12px}

/* ===== 6. Nodes ===== */
.node{position:absolute;width:190px;height:64px;display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--p);border:1px solid var(--b2);border-radius:14px;user-select:none;cursor:pointer;box-shadow:0 6px 18px #0004;transition:opacity var(--slow),box-shadow var(--fast),border-color var(--fast);animation:enter .3s ease}
.node::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--fc,transparent)}
.node[data-type=faction]{border-radius:4px 4px 24px 24px;border-width:2px}
.node[data-type=location]{border-radius:99px}
.node[data-type=event]{border-radius:4px;border-style:double;border-width:3px}
.node[data-type=power]{border-radius:24px 4px}
.node[data-type=item]{border-radius:4px 18px 4px 4px}
.node.key{background:linear-gradient(var(--p2),var(--p));border-color:var(--m)}
.av{position:relative;width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--p2) center/cover;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent)}
.av .ico{width:22px;height:22px}
.node[data-type=character] .av{border-radius:50%}
.av .badge{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:6px;background:var(--p);border:1px solid var(--tc);display:grid;place-items:center}.av .badge .ico{width:12px;height:12px}
.node>.txt{min-width:0;flex:1}
.nm{display:block;font-weight:650;font-size:13.5px;line-height:1.25}
.node .sm{display:block}
.node.dim{opacity:.14}
.node.nb{border-color:color-mix(in srgb,var(--a) 70%,transparent)}
.node.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a),0 0 28px color-mix(in srgb,var(--a) 45%,transparent);z-index:2}
.node.cyc{outline:2px dashed var(--c-enemy);outline-offset:4px}
.node.leave{opacity:0;pointer-events:none}
.more{position:absolute;right:-8px;top:-10px;min-height:22px;padding:0 7px;font-size:11px;border-radius:99px;background:var(--p2);border-color:var(--b2)}
.port{position:absolute;right:-8px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--a);border:2px solid var(--p);cursor:crosshair;opacity:0}.node:hover .port{opacity:1}
@keyframes enter{from{opacity:0}}

/* ===== 7. Edges and zones ===== */
#eg path.line{fill:none;stroke-linecap:round;transition:stroke-opacity var(--slow)}
#eg path.h{pointer-events:stroke;cursor:pointer;fill:none;stroke:transparent;stroke-width:16}
#eg text{fill:var(--t);paint-order:stroke;stroke:var(--bg);stroke-linejoin:round;text-anchor:middle;font-weight:600}
#eg g:hover path.line{stroke-opacity:1;stroke-width:4}
.zone{position:absolute;border-radius:28px;border:1px dashed color-mix(in srgb,var(--fc) 55%,transparent);background:color-mix(in srgb,var(--fc) 9%,transparent);pointer-events:none;transition:opacity var(--slow)}
.zone.dim{background:transparent;border-color:var(--b)}.zone.dim .zh{opacity:.35}
.zh{z-index:1;position:absolute;left:14px;top:8px;right:14px;display:flex;gap:6px;pointer-events:auto}
.zh button{background:none;border:0;min-height:30px;padding:0 6px;font:600 15px var(--display)}.zh .zn{justify-content:flex-start;min-width:0}.zh .zt{margin-left:auto;font:12px var(--ui);color:var(--m);white-space:nowrap}

/* ===== 8. Detail drawer ===== */
#insp{border-left:1px solid var(--b);visibility:hidden;overflow-x:hidden}
main.open #insp{visibility:visible}
.dbar{position:sticky;top:0;z-index:3;display:flex;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3);background:var(--p);border-bottom:1px solid var(--b)}
.dbody{padding:var(--s4)}
.hero{height:170px;border-radius:var(--r3);display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--tc) 28%,var(--p2)),var(--p2));background-size:cover;color:var(--tc);margin-bottom:var(--s3)}
.hero .ico{width:64px;height:64px;stroke-width:1.2}
.dbody h2{font-size:24px;overflow-wrap:anywhere}
.dbody h4{font:600 15px var(--display);margin:var(--s5) 0 var(--s2);padding-bottom:var(--s1);border-bottom:1px solid var(--b)}
.dbody h5{font-size:12px;margin:var(--s2) 0 var(--s1);display:flex;gap:6px;align-items:center;font-weight:600}
.dbody input,.dbody select{max-width:100%}.edit input:not([type=checkbox]),.edit select{width:100%}.edit input[type=color]{height:36px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:var(--s3)}
.warn{border:1px solid var(--c-rival);border-radius:var(--r2);padding:var(--s3);margin-top:var(--s3)}
.sw{width:18px;height:3px;border-radius:2px;flex:none;display:inline-block}

/* ===== 9. List, timeline and other views ===== */
.scr{overflow:auto;flex:1;padding:var(--s4)}
.bar{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--b);padding:8px;text-align:left;vertical-align:middle}
th button{background:none;border:0;padding:0;font-weight:650}
td input,td select{width:100%;background:transparent;border-color:transparent}
.link{background:none;border:0;padding:0;min-height:0;font-weight:650;text-align:left;justify-content:flex-start}.link:hover{text-decoration:underline}[data-show]{white-space:nowrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s3);padding:var(--s4);overflow:auto}
.card{background:var(--p);border:1px solid var(--b);border-radius:var(--r3);overflow:hidden;cursor:pointer}.card:hover{border-color:var(--a)}
.card .im{height:120px;background:var(--p2) center/cover;display:grid;place-items:center}.card .im .ico{width:42px;height:42px}.card div.i{padding:var(--s2) var(--s3)}
.tag{display:inline-block;background:var(--p2);border-radius:99px;padding:1px 8px;font-size:11px;margin:2px 2px 0 0;color:var(--m)}
.tline{flex:1;display:flex;overflow:auto;padding:var(--s5) var(--s4);align-items:flex-start}
.era{flex:0 0 280px;border-top:2px solid var(--b2);padding:var(--s4) var(--s3) 0;position:relative}
.era::before{content:"";position:absolute;left:var(--s3);top:-7px;width:12px;height:12px;border-radius:50%;background:var(--a)}
.era h3{font-size:16px}
.ev{background:var(--p);border:1px solid var(--b);border-radius:var(--r3);padding:var(--s3);margin-bottom:var(--s3)}.ev.on{border-color:var(--a)}

/* ===== 10. Modals, toasts, loading, errors ===== */
.mod{position:fixed;inset:0;background:#000a;display:grid;place-items:start center;padding-top:8vh;z-index:70}
.mod>div{background:var(--p);border:1px solid var(--b2);border-radius:var(--r3);padding:var(--s4);width:min(680px,94vw);max-height:82vh;overflow:auto;box-shadow:var(--shadow)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.igrid div{cursor:pointer;font-size:10px;color:var(--m)}.igrid img{width:100%;height:100px;object-fit:cover;border-radius:8px;display:block}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:99}#toast div{background:var(--p);border:1px solid var(--a);padding:8px 14px;border-radius:var(--r2)}
.skel{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-auto-rows:64px;gap:var(--s5);padding:var(--s5)}
.skel i{border-radius:14px;background:var(--p2);animation:pulse 1.2s ease infinite alternate}@keyframes pulse{to{opacity:.4}}

/* ===== 11. Fullscreen and responsive ===== */
body.full header,body.full #side{display:none}body.full main{grid-template-columns:0 minmax(0,1fr) 0}body.full main.open{grid-template-columns:0 minmax(0,1fr) 360px}
body.full #cen{grid-column:2}body.full #insp{grid-column:3}
@media(max-width:1200px){#bSearch kbd,.brand span{display:none}header{gap:6px;padding:10px var(--s2)}header button{white-space:nowrap;padding:6px 9px}#bHelp .desk,#bTh .desk,#bAdd.desk{display:none}#uSel{max-width:160px}#bSearch{flex:none}#bSearch span+span{display:none}#tools{flex-wrap:nowrap;overflow-x:auto}#tools button{white-space:nowrap;padding:6px 9px}main,main.open{grid-template-columns:240px minmax(0,1fr)}main{position:relative}
 #insp{position:absolute;right:0;top:0;bottom:0;width:min(360px,100%);z-index:20;box-shadow:var(--shadow)}main:not(.open) #insp{display:none}
 body.full main,body.full main.open{grid-template-columns:minmax(0,1fr)}body.full #cen{grid-column:1}#hint{display:none}}
@media(max-width:820px){
 .mob{display:inline-flex!important}.desk{display:none!important}
 header{flex-wrap:wrap;padding:var(--s2);gap:6px}
 button,input,select{min-height:44px}.chip{min-height:36px}
 #uSel{flex:1;min-width:0;max-width:none}#bSearch{min-width:44px;flex:none}#bSearch span+span{display:none}header .sp{display:none}
 .seg{order:9;flex:1}.seg button{flex:1;min-height:40px;padding:4px 8px}#vMore{order:9;width:92px}
 #more{top:56px;right:var(--s2)}
 main,main.open{grid-template-columns:minmax(0,1fr)}
 #side{position:fixed;left:0;right:0;bottom:0;max-height:75dvh;z-index:40;border:1px solid var(--b2);border-radius:var(--r3) var(--r3) 0 0;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform var(--slow),visibility var(--slow)}
 #side.show{transform:none;visibility:visible}
 #insp{position:fixed;left:0;right:0;top:auto;width:auto;max-height:62dvh;border:1px solid var(--b2);border-radius:var(--r3) var(--r3) 0 0;z-index:35}
 #mm,#hint{display:none}
 #tools{max-width:calc(100% - 24px);flex-wrap:nowrap;overflow-x:auto}#tools button{white-space:nowrap}
 #status{top:68px;max-width:calc(100% - 16px)}#status .long{display:none}
 #selbar{left:var(--s2);right:var(--s2);transform:none;bottom:64px}#selbar b{flex:1}
 #legend{max-width:calc(100% - 84px)}
 .list thead{display:none}.list tr{display:block;background:var(--p);border:1px solid var(--b);border-radius:var(--r3);margin-bottom:var(--s3);padding:var(--s2)}.list td{display:flex;gap:var(--s3);justify-content:space-between;border:0;padding:3px 6px}.list td::before{content:attr(data-l);color:var(--m);font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
#legend:has(details[open]){width:290px}
</style></head><body>
<header>
<b class="brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="9" r="2.5"/><circle cx="9" cy="19" r="2.5"/><path d="M7.4 6.5l9.2 2M6 8.3l2.3 8.3M17 11l-6.4 6.3"/></svg><span>LoreWeave</span></b>
<select id="uSel" aria-label="Universe"></select>
<button id="bSearch" aria-label="Search everything"><span aria-hidden="true">⌕</span><span>Search everything</span><kbd>Ctrl K</kbd></button>
<span class="sp"></span>
<div class="seg" id="tabs" role="group" aria-label="View"></div>
<select id="vMore" aria-label="More views"></select>
<button id="bFilters" class="mob" aria-expanded="false">Filters</button>
<button id="bAdd" class="pri desk">+ Add entity</button>
<button id="bHelp" aria-label="How to read this graph">? <span class="desk">Help</span></button>
<button id="bTh" aria-label="Switch dark or light theme">◐ <span class="desk">Theme</span></button>
<button id="bMore" aria-haspopup="true" aria-expanded="false" aria-label="More actions">⋯</button>
<div id="more" hidden><button data-id="bAdd">+ Add entity</button><button data-id="bUni">Manage universes</button><button data-id="bUndo">↶ Undo</button><button data-id="bRedo">↷ Redo</button><button data-id="bExp">Export backup</button><button data-id="bImp">Import backup</button><span id="sv" class="sm" aria-live="polite" style="padding:6px 12px"></span></div>
<input type="file" id="fi" accept=".json" hidden>
</header>
<main><aside id="side" aria-label="Discovery and filters"></aside><section id="cen" aria-label="Main view"><div id="mainv"><div class="skel" aria-label="Loading your universe"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></section><aside id="insp" aria-label="Details"></aside></main>
<div id="tt" role="tooltip" hidden></div><div id="toast" role="status"></div>
<script>
// ===== ORIGINAL: constants, storage, model helpers, demo (unchanged) =====

 only its simplest tools.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "\"Exiles\" is the term used on the Ardashir page; treating it as the same group follows that page.", "quotes": "", "links": "", "origin": "", "spoiler": "endgame", "date": "", "x": 2794, "y": -500, "img": null, "kind": "organization", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "confirmed", "sources": ["fnd", "ard"]}, {"id": "lx_pre", "type": "race", "name": "Precursors", "aliases": "Precursor civilization", "summary": "Ancient civilization whose technology, including the Cosmic Gate, survives.", "desc": "<p>The Cosmic Gate is a Precursor portal. The Foundation has mastered the Precursor legacy. The Cabal of Tranquility excavates Precursor ruins.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Their relationship to the creators of Originium is not established by the sources read.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "", "x": 3004, "y": -500, "img": null, "kind": "species", "scope": "Both", "era": "Ancient", "conf": "confirmed", "sources": ["cg", "fnd", "cab"]}, {"id": "lx_ankhor", "type": "concept", "name": "Ankhor", "aliases": "Ankhor points", "summary": "Constructs that create Aggeloi.", "desc": "<p>Ankhor points appeared suddenly and Aggeloi swarms overran the first cities. A restricted file attributes Ankhors to the Foundation.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "", "x": 3214, "y": -500, "img": null, "kind": "technology", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "confirmed", "sources": ["agg", "faw", "fnd"]}, {"id": "lx_heroes", "type": "faction", "name": "Forty Heroes", "aliases": "", "summary": "Heroes who fought beside the Endministrator at the North Pole in Year 15.", "desc": "<p>The Endministrator and the Forty Heroes won a decisive battle that removed the Foundation threat and helped end the First Aggeloi War.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Only Gerald Zasso is named as one of them in the pages read.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "", "x": 3424, "y": -500, "img": null, "kind": "faction", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "confirmed", "sources": ["fnd", "oso"]}, {"id": "lx_zasso", "type": "character", "name": "Gerald Zasso", "aliases": "The Sanctified; Lord Castellan", "summary": "Lord Castellan of the Order of Steel Oath and one of the Forty Heroes.", "desc": "<p>Listed as Ember's recommender in her employment contract with Endfield Industries.<\/p>", "status": "unknown", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "", "x": 3634, "y": -500, "img": null, "kind": "npc", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "reported", "sources": ["oso"]}, {"id": "lx_second", "type": "event", "name": "Second Aggeloi War", "aliases": "", "summary": "War of about Year 139 onward; its end date is uncertain.", "desc": "<p>The timeline dates it ca. 139, possibly ending 142. The Polar Expedition falls within it.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Start and end are approximate.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "ca. Year 139-142", "x": 3844, "y": -500, "img": null, "kind": "event", "scope": "Endfield", "era": "Second war era (Y139-151)", "conf": "reported", "sources": ["tl"], "ord": 2}, {"id": "lx_humil", "type": "event", "name": "Humiliation War", "aliases": "", "summary": "Civil war among stranded factions after they realized they might never return to Terra.", "desc": "<p>Dated ca. Feb to Jul of Year 15. The timeline says humanity's first man-made Catastrophe was developed and used during it, and that Tianshi Ruan led dissidents to found Qingbo Stockade.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "The Stockade file attributes the founding to this period only on the word of folk historians.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "ca. Year 15", "x": 4054, "y": -500, "img": null, "kind": "event", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "reported", "sources": ["tl", "qb"], "ord": 1.6}, {"id": "lx_contam", "type": "event", "name": "Contamination of the First Originium", "aliases": "", "summary": "The First Originium is contaminated in the last battle of the war.", "desc": "<p>Dated ca. Feb of Year 15; its information crystal degraded, and surviving data shards later give rise to Reconveners.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Date approximate.", "quotes": "", "links": "", "origin": "", "spoiler": "endgame", "date": "ca. Year 15", "x": 2584, "y": -350, "img": null, "kind": "event", "scope": "Both", "era": "War era (Y1-17)", "conf": "reported", "sources": ["tl", "nrec"], "ord": 1.5}, {"id": "lx_first_o", "type": "item", "name": "First Originium", "aliases": "", "summary": "One of three Terran First Originium fragments; source of all Originium on Talos-II.", "desc": "<p>The fragment that reached Talos-II is the source of its Originium. Damage to it left data shards that Warfarin learned to guide out of the Originium Woods.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "endgame", "date": "", "x": 2794, "y": -350, "img": null, "kind": "item", "scope": "Both", "era": "War era (Y1-17)", "conf": "confirmed", "sources": ["ori", "nrec"]}, {"id": "lx_cbfound", "type": "event", "name": "Founding of the Civilization Band", "aliases": "", "summary": "The Civilization Band is established, ca. Year 17.", "desc": "<p>Some accounts date the true end of the First Aggeloi War to this founding.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "ca. Year 17", "x": 3004, "y": -350, "img": null, "kind": "event", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "reported", "sources": ["tl", "faw"], "ord": 1.7}, {"id": "lx_hasfound", "type": "event", "name": "Founding of the Hongshan Academy", "aliases": "", "summary": "HAS is founded, affiliated with the Tianshi Bureau of Great Yan.", "desc": "<p>HAS grew from a Yan surveillance team that stayed to fight rather than return through the Gate.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "Year 17", "x": 3214, "y": -350, "img": null, "kind": "event", "scope": "Endfield", "era": "War era (Y1-17)", "conf": "reported", "sources": ["tl", "has"], "ord": 1.75}, {"id": "lx_aburrey", "type": "character", "name": "Aburrey", "aliases": "Aburrey the Hero", "summary": "Educator who died in Year 75 saving students from Aggeloi in Valley IV.", "desc": "<p>She set off quarry explosives to cause a rockslide. The UWST named the quarry Aburrey Quarry; excavation there uncovered the \"Stone of Aburrey\".<\/p>", "status": "dead", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "", "x": 3424, "y": -350, "img": null, "kind": "npc", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "confirmed", "sources": ["abu"]}, {"id": "lx_jakub", "type": "character", "name": "Jakub Meissen", "aliases": "Warlord of the Wilds", "summary": "War hero turned warlord who coined the name Landbreaker.", "desc": "<p>In Year 90 he built a bandit army and seized an Originium cultivation site; the Civilization Band crushed it.<\/p>", "status": "dead", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "", "x": 3634, "y": -350, "img": null, "kind": "npc", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "confirmed", "sources": ["lb", "tl"]}, {"id": "lx_jreb", "type": "event", "name": "Jakub's Rebellion", "aliases": "", "summary": "Year 90 Landbreaker revolt, defeated by the Civilization Band.", "desc": "<p>The timeline says the Pack turned on his loyalists and the Landbreakers later split into clans.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "Year 90", "x": 3844, "y": -350, "img": null, "kind": "event", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "reported", "sources": ["lb", "tl"], "ord": 1.9}, {"id": "lx_astarron", "type": "character", "name": "Astarron", "aliases": "Giant Aggelos", "summary": "Giant Aggelos that attacked Valley IV about twenty years before the present.", "desc": "<p>All countermeasures failed until the UWST detonated the Great Originium Oak.<\/p>", "status": "destroyed", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "", "x": 4054, "y": -350, "img": null, "kind": "npc", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "confirmed", "sources": ["cra"]}, {"id": "lx_cradle", "type": "location", "name": "Cradle of the Ages", "aliases": "Great Originium Oak", "summary": "Root system of the Great Originium Oak in the Origin Lodespring.", "desc": "<p>The Endministrator planted the Oak to power early Valley IV. The UWST detonated it to destroy Astarron.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "", "x": 2584, "y": -200, "img": null, "kind": "location", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "confirmed", "sources": ["cra"]}, {"id": "lx_cradlebattle", "type": "event", "name": "Destruction of the Great Originium Oak", "aliases": "", "summary": "The Oak is detonated to destroy Astarron, ca. Year 132.", "desc": "<p>The file only says about two decades ago; the timeline gives ca. Year 132.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Date approximate.", "quotes": "", "links": "", "origin": "", "spoiler": "minor", "date": "ca. Year 132", "x": 2794, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Band era (Y18-138)", "conf": "reported", "sources": ["cra", "tl"], "ord": 1.95}, {"id": "lx_vlrdis", "type": "event", "name": "Wuling Science Station disaster", "aliases": "", "summary": "Year 142 attempt to cut off the Wuling rift ends in a Blight tide.", "desc": "<p>Within two hours the station and prototype Xiranite facilities were destroyed. Survivors later built Wuling City beside the ruins.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "Year 142", "x": 3004, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Second war era (Y139-151)", "conf": "confirmed", "sources": ["vlr", "wc"], "ord": 2.1}, {"id": "lx_polar", "type": "event", "name": "Polar Expedition", "aliases": "", "summary": "Year 142 northern campaign after which the Endministrator falls into Stasis.", "desc": "<p>Aggeloi raided an Endfield outpost; the Endministrator led an Endfield and UWST force north.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "Year 142", "x": 3214, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Second war era (Y139-151)", "conf": "reported", "sources": ["tl", "per"], "ord": 2.2}, {"id": "lx_v4inv", "type": "event", "name": "Bonekrusher invasion of Valley IV", "aliases": "", "summary": "Nefarith's Bonekrushers seize the Æther Test Site.", "desc": "<p>The Endfield Crisis Team retook the site, but the Bonekrushers escaped.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "Order within Year 152 follows the timeline listing.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "Year 152", "x": 3424, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Present (Y152)", "conf": "reported", "sources": ["tl", "nef"], "ord": 3.2}, {"id": "lx_conf4", "type": "event", "name": "Conference of the Four", "aliases": "", "summary": "Secret meeting aboard Dijiang on Wuling and the North Pole.", "desc": "<p>UWST, TGCC, HAS and Endfield Industries attended.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "Year 152", "x": 3634, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Present (Y152)", "conf": "reported", "sources": ["tl"], "ord": 3.4}, {"id": "lx_homec", "type": "event", "name": "Operation Homecoming", "aliases": "", "summary": "Zhuang Fangyi's force moves to reclaim the Science Station in the North Wuling Exclusion Zone.", "desc": "<p>The timeline records the launch only.<\/p>", "status": "active", "importance": "supporting", "tags": "", "fields": [], "notes": "No outcome is recorded. Not the same thing as the ancestral \"Homecoming\" in the Terra file.", "quotes": "", "links": "", "origin": "", "spoiler": "major", "date": "ca. Year 152", "x": 3844, "y": -200, "img": null, "kind": "event", "scope": "Endfield", "era": "Present (Y152)", "conf": "reported", "sources": ["tl"], "ord": 8}, {"id": "lx_mush", "type": "event", "name": "Wuling hallucination outbreak", "aliases": "I Dream of Honey Waffles", "summary": "Kay and the Endministrator deal with the Mushroom King.", "desc
